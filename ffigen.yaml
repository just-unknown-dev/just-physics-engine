llvm-path:
  - 'C:\Program Files\LLVM'
  - 'C:\Program Files (x86)\LLVM'

name: Box2DBindings
description: >
  Dart FFI bindings generated from box2d_wrapper.h.
  Only the public C wrapper surface is parsed — Box2D internal headers
  are excluded via include-directives.
output: 'lib/src/box2d/ffi/box2d_bindings.dart'

# Top-level @Native functions resolved through the code asset the build hook
# bundles (hook/build.dart, assetName 'box2d_flutter'), so the library is
# found by asset id on every platform — Android's libbox2d_flutter.so too —
# rather than by a file name DynamicLibrary.open has to guess.
ffi-native:
  assetId: 'package:just_physics_engine/box2d_flutter'

headers:
  entry-points:
    - 'src/native/box2d_wrapper.h'
  include-directives:
    - 'src/native/box2d_wrapper.h'

functions:
  include:
    - 'b2w_.*'
  # Addresses (`addresses.…`): the finalizers, for NativeFinalizer, and the
  # symbols loadBox2DLibrary() resolves up front to prove the bundled
  # library matches these bindings.
  symbol-address:
    include:
      - 'b2w_finalizer_.*'
      - 'b2w_createBody'
      - 'b2w_setBodyTransform'
      - 'b2w_setBodyType'
      - 'b2w_getBodyType'
      - 'b2w_setBodyOneWay'
      - 'b2w_castRayClosest'
      - 'b2w_castRayAll'
      - 'b2w_queryAABB'
      - 'b2w_setBodyFilter64'
      - 'b2w_setBodyFriction'
      - 'b2w_setBodyRestitution'
      - 'b2w_setBodyLinearDamping'

globals:
  exclude:
    - '.*'

structs:
  exclude:
    - '.*'

enums:
  exclude:
    - '.*'

comments:
  style: any
  length: full

preamble: |
  // AUTO-GENERATED — do not edit.
  // Regenerate with: dart run ffigen --config ffigen.yaml
  // ignore_for_file: type=lint, camel_case_types, non_constant_identifier_names
