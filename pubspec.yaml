name: just_physics_engine
description: "Standalone 2D/3D physics engine for Flutter: 2D on native Box2D v3.2 (FFI) with a pure-Dart fallback, 3D on Jolt Physics through just_jolt."
version: 1.4.0
homepage: https://github.com/just-unknown-dev/just-physics-engine
repository: https://github.com/just-unknown-dev/just-physics-engine
issue_tracker: https://github.com/just-unknown-dev/just-physics-engine/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - physics
  - game-engine
  - flutter
  - wasm

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  # Box2D for the 2-D engine, compiled from source by its build hook unless
  # an app turns it off (hooks: user_defines: just_box_2d: build: false).
  just_box_2d: ^0.1.0
  just_dart: ^0.2.0
  # Jolt Physics for the 3-D engine. Its native library is compiled only
  # when the app asks (hooks: user_defines: just_jolt: build: true), so a
  # 2-D game neither builds nor ships it.
  just_jolt: ^0.1.0
  meta: ^1.17.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# This package's own tests run Jolt; an app that uses 3-D says the same in
# its pubspec.
hooks:
  user_defines:
    just_jolt:
      build: true

flutter:
