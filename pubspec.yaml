name: just_physics_engine
description: "Standalone 2D/3D physics engine for Flutter — pure-Dart fallback + native Box2D v3.0 FFI backend."
version: 1.2.0
homepage: https://github.com/just-unknown-dev/just-physics-engine
repository: https://github.com/just-unknown-dev/just-physics-engine
issue_tracker: https://github.com/just-unknown-dev/just-physics-engine/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ^1.0.0
  just_dart: ^0.1.0
  just_memory: ^0.1.0
  meta: ^1.17.0
  native_toolchain_c: ^0.17.0

dev_dependencies:
  # Native build hook dependencies — only needed at build time.
  ffigen: ^12.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  logging: ^1.3.0

